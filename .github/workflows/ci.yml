name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Installed bare first: the test suite must pass with no extras, which is
      # what guarantees the quickstart works on a plain `pip install`.
      - name: Install (no extras)
        run: pip install -e . pytest pytest-cov
      - name: Test without optional dependencies
        run: pytest -q

      - name: Install dev extras
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src
      - name: Test with coverage
        run: pytest -q --cov=opscopilot --cov-report=xml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Publishes on a GitHub release, via PyPI Trusted Publishing — no API token
    # stored in repository secrets.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
