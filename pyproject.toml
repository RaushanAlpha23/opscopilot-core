[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "opscopilot-core"
version = "0.2.3"
description = "An agentic SRE engine: screenshot-grounded bug triage, code-aware RAG diagnosis, and human-in-the-loop remediation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Raushan Alpha" }]
keywords = ["sre", "agent", "rag", "triage", "incident", "langgraph", "devops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Bug Tracking",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]

# The core install stays deliberately light: no torch, no vector DB, no LLM
# SDK. `pip install opscopilot-core` must succeed in seconds and run offline.
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
mistral = ["langchain-mistralai>=0.2", "langchain-core>=0.3"]
openai = ["openai>=1.30"]
gemini = ["google-genai>=1.0"]
qdrant = ["qdrant-client>=1.9"]
redis = ["redis>=5.0"]
local-embeddings = ["sentence-transformers>=3.0"]
github = ["requests>=2.31"]
graph = ["langgraph>=0.2"]

all = [
  "langchain-mistralai>=0.2",
  "langchain-core>=0.3",
  "openai>=1.30",
  "google-genai>=1.0",
  "qdrant-client>=1.9",
  "redis>=5.0",
  "sentence-transformers>=3.0",
  "requests>=2.31",
  "langgraph>=0.2",
]
dev = [
  "opscopilot-core[all]",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.5",
  "build>=1.2",
  "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/RaushanAlpha23/opscopilot-core"
Repository = "https://github.com/RaushanAlpha23/opscopilot-core"
Issues = "https://github.com/RaushanAlpha23/opscopilot-core/issues"
Changelog = "https://github.com/RaushanAlpha23/opscopilot-core/blob/main/CHANGELOG.md"

[project.scripts]
opscopilot = "opscopilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opscopilot"]

[tool.hatch.build.targets.sdist]
include = ["src/opscopilot", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md", "MIGRATION.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# No python_version pin: mypy then targets whichever interpreter is actually
# running it. Pinning this to 3.10 (the package's minimum supported version)
# seemed right, but it isn't the same thing — it forces mypy to parse every
# third-party .pyi stub as 3.10 syntax too. Newer numpy (a transitive
# dependency of qdrant-client) ships stubs using the 3.12+ `type` statement,
# so under a pinned "3.10" target, mypy fails on 3.12/3.13 CI runners even
# though the actual code and interpreter are fine — the pin was checking the
# wrong thing.
packages = ["opscopilot"]
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
